name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days with no activity. This
# queries a real table once a day (well under that threshold) so it never
# pauses.
#
# Endpoint choice: this used to ping `/auth/v1/health` instead, because the
# bare REST root (`/rest/v1/` with no resource) rejects the anon key on this
# project (`UNAUTHORIZED_INVALID_API_KEY_TYPE`). But the project paused
# again anyway after dozens of straight daily successes against that
# endpoint - a generic health check most likely isn't the kind of activity
# that resets Supabase's inactivity clock. Querying an actual table (same
# `reviews` table the live site's Testimonials component reads with this
# same anon key) is real data access, which should actually count.
#
# The key is the legacy `anon`/`public` key, read from a repo secret named
# SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a real table to keep the project active
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          host="niznyouzvtnamcosybtg.supabase.co"
          # A paused (or deleted) Supabase project stops resolving in DNS
          # entirely, so no query can wake it. Fail with a clear message
          # instead of a bare curl error.
          if ! getent hosts "$host" >/dev/null; then
            echo "::error::$host does not resolve - the Supabase project is paused or deleted. Resume it from the Supabase dashboard (supabase.com/dashboard/projects); this check can't wake a paused project." >&2
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://$host/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase reviews query responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            echo "Expected HTTP 200, got $status" >&2
            exit 1
          fi
