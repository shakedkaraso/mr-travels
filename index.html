<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr-Travel — בקרוב</title>
<meta name="description" content="Mr-Travel — האתר שלכם לטיסות זולות, בקרוב.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1b34;
    --ink-soft:#4a4b63;
    --pink:#ec1e8c;
    --pink-ink:#ffffff;
    --card-bg:rgba(255,255,255,.22);
    --card-border:rgba(255,255,255,.4);
    --line:rgba(255,255,255,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#0a3a4a url("beach.jpg") center center / cover no-repeat fixed;
    color:var(--ink);
    font-family:"Rubik","Segoe UI",Arial,sans-serif;
    padding:24px;
  }
  .card{
    max-width:440px;
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:22px;
    box-shadow:0 8px 32px -12px rgba(10,20,30,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:40px 32px 34px;
    text-align:center;
  }
  .badge{
    width:161px;
    height:auto;
    margin:0 auto 14px;
    display:block;
  }
  h1{
    font-size:48px;
    font-weight:800;
    margin:0 0 6px;
    line-height:1.15;
    color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  h2{
    font-size:36px;
    font-weight:700;
    margin:0 0 14px;
    line-height:1.2;
    color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  p.lede{
    font-size:14.5px;
    color:#fff;
    opacity:.92;
    margin:0 0 26px;
    line-height:1.6;
    text-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  form{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  input[type="email"]{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:999px;
    padding:11px 16px;
    font-size:14px;
    font-family:inherit;
    background:rgba(255,255,255,.85);
    color:var(--ink);
  }
  input[type="email"]::placeholder{
    color:var(--ink-soft);
  }
  input[type="email"]:focus{
    outline:2px solid var(--pink);
    outline-offset:1px;
  }
  button{
    border:none;
    border-radius:999px;
    padding:11px 20px;
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    background:var(--pink);
    color:var(--pink-ink);
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 6px 16px -6px rgba(236,30,140,.6);
  }
  button:focus-visible{
    outline:2px solid #fff;
    outline-offset:2px;
  }
  .note{
    font-size:12px;
    color:#fff;
    opacity:.85;
    text-shadow:0 1px 3px rgba(0,0,0,.25);
  }
</style>
</head>
<body>
  <main class="card">
    <img class="badge" src="logo.png" alt="לוגו Mr.travels">
    <h1>האתר בבנייה</h1>
    <h2>טיסות זולות בדרך אליכם</h2>
    <p class="lede">אנחנו עובדים על האתר. השאירו מייל ותהיו הראשונים לדעת כשעולים לאוויר.</p>
    <form onsubmit="event.preventDefault(); this.querySelector('button').textContent='תודה, נעדכן!';">
      <input type="email" required placeholder="האימייל שלכם" aria-label="האימייל שלכם">
      <button type="submit">עדכנו אותי</button>
    </form>
    <p class="note">Mr-Travel.co.il · בקרוב</p>
  </main>
</body>
</html>
